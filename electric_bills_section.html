  ELECTRIC BILL SECTION
  Add this HTML right before the closing </div> of dashContent in solar.html
  And add the JS right before the closing </script> tag
-->

<!-- ============ HTML TO ADD ============ -->

<h2 class="section-title">💡 Electric Bills</h2>

<!-- Upload area -->
<div class="card" id="billUploadCard">
    <h3>📄 Scan Bills</h3>
    <p style="font-size:0.85rem;color:var(--sage-500);margin-bottom:14px;">Upload Met-Ed PDF bills — AI will extract meter, usage, and cost data</p>
    <div id="dropZone" style="border:2px dashed var(--sage-300);border-radius:10px;padding:32px;text-align:center;cursor:pointer;transition:all 0.2s;background:var(--sage-50);" onclick="document.getElementById('billFiles').click()">
        <div style="font-size:2rem;margin-bottom:8px;">📎</div>
        <div style="color:var(--sage-600);font-weight:500;">Drop PDFs here or click to browse</div>
        <div style="color:var(--sage-400);font-size:0.8rem;margin-top:4px;">Upload multiple bills at once</div>
        <input type="file" id="billFiles" multiple accept=".pdf" style="display:none;" onchange="handleBillUpload(this.files)">
    </div>
    <div id="uploadProgress" style="margin-top:14px;display:none;">
        <div id="uploadStatus" style="font-size:0.85rem;color:var(--sage-600);"></div>
        <div style="background:var(--sage-100);border-radius:6px;height:8px;margin-top:8px;overflow:hidden;">
            <div id="uploadBar" style="height:100%;background:var(--sage-500);border-radius:6px;transition:width 0.3s;width:0%;"></div>
        </div>
    </div>
</div>

<!-- Bill history table -->
<div class="card">
    <h3>📊 Usage History</h3>
    <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;">
        <button class="meter-filter-btn active" onclick="filterMeter('all')">All Meters</button>
        <div id="meterFilterBtns"></div>
    </div>
    <div id="billsChart" style="height:300px;margin-bottom:20px;"><canvas id="billsCanvas"></canvas></div>
    <div style="overflow-x:auto;">
        <table id="billsTable" style="width:100%;border-collapse:collapse;font-size:0.85rem;">
            <thead>
                <tr style="border-bottom:2px solid var(--sage-300);text-align:left;">
                    <th style="padding:8px 6px;color:var(--sage-600);font-weight:700;">Period</th>
                    <th style="padding:8px 6px;color:var(--sage-600);font-weight:700;">Meter</th>
                    <th style="padding:8px 6px;color:var(--sage-600);font-weight:700;text-align:right;">kWh</th>
                    <th style="padding:8px 6px;color:var(--sage-600);font-weight:700;text-align:right;">Energy Cost</th>
                    <th style="padding:8px 6px;color:var(--sage-600);font-weight:700;text-align:right;">Fees</th>
                    <th style="padding:8px 6px;color:var(--sage-600);font-weight:700;text-align:right;">Total</th>
                    <th style="padding:8px 6px;color:var(--sage-600);font-weight:700;text-align:right;">$/kWh</th>
                </tr>
            </thead>
            <tbody id="billsBody"></tbody>
        </table>
    </div>
    <div id="billsSummary" style="margin-top:16px;padding-top:14px;border-top:2px solid var(--sage-300);"></div>
</div>

<style>
.meter-filter-btn{border:1px solid var(--sage-300);background:var(--sage-50);color:var(--sage-600);border-radius:6px;padding:5px 14px;font-size:0.8rem;cursor:pointer;font-family:'Karla';font-weight:500;transition:all 0.2s;}
.meter-filter-btn.active{background:var(--sage-500);color:white;border-color:var(--sage-500);}
.meter-filter-btn:hover:not(.active){background:var(--sage-100);}
#dropZone.dragover{border-color:var(--sage-500);background:var(--sage-100);}
</style>


<!-- ============ JAVASCRIPT TO ADD ============ -->
<script>
// Electric Bill Scanner & Display
let allBills = [];
let billChart = null;
let activeMeterFilter = 'all';

// Drag and drop
const dz = document.getElementById('dropZone');
if (dz) {
    dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('dragover'); });
    dz.addEventListener('dragleave', () => dz.classList.remove('dragover'));
    dz.addEventListener('drop', e => { e.preventDefault(); dz.classList.remove('dragover'); handleBillUpload(e.dataTransfer.files); });
}

async function handleBillUpload(files) {
    if (!files || files.length === 0) return;
    
    const pdfs = Array.from(files).filter(f => f.type === 'application/pdf');
    if (pdfs.length === 0) { alert('Please upload PDF files'); return; }

    const prog = document.getElementById('uploadProgress');
    const status = document.getElementById('uploadStatus');
    const bar = document.getElementById('uploadBar');
    prog.style.display = 'block';

    for (let i = 0; i < pdfs.length; i++) {
        status.textContent = `Processing ${i + 1} of ${pdfs.length}: ${pdfs[i].name}...`;
        bar.style.width = ((i / pdfs.length) * 100) + '%';
        
        try {
            const billData = await scanBillWithAI(pdfs[i]);
            if (billData) {
                await saveBillToSupabase(billData);
            }
        } catch (err) {
            console.error(`Error processing ${pdfs[i].name}:`, err);
            status.textContent = `Error on ${pdfs[i].name}: ${err.message}`;
        }
    }

    bar.style.width = '100%';
    status.textContent = `Done! Processed ${pdfs.length} bill(s).`;
    setTimeout(() => { prog.style.display = 'none'; }, 3000);
    
    loadBillHistory();
}

async function scanBillWithAI(file) {
    // Convert PDF to base64
    const base64 = await new Promise((res, rej) => {
        const reader = new FileReader();
        reader.onload = () => res(reader.result.split(',')[1]);
        reader.onerror = () => rej(new Error('Failed to read file'));
        reader.readAsDataURL(file);
    });

    const response = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            model: 'claude-sonnet-4-20250514',
            max_tokens: 1000,
            messages: [{
                role: 'user',
                content: [
                    {
                        type: 'document',
                        source: { type: 'base64', media_type: 'application/pdf', data: base64 }
                    },
                    {
                        type: 'text',
                        text: `Extract the following from this Met-Ed electric bill. Return ONLY valid JSON, no markdown backticks or other text.

{
  "account_number": "the account number",
  "meter_number": "the meter number from Usage Information section",
  "meter_label": "identify which unit this is from the service address - look for APT number like 101, 201, 202/3C, or if no apartment then Landlord",
  "invoice_number": "the invoice number",
  "billing_period_start": "YYYY-MM-DD",
  "billing_period_end": "YYYY-MM-DD",
  "billing_days": number,
  "kwh_used": number,
  "meter_reading_start": number,
  "meter_reading_end": number,
  "avg_daily_kwh": number,
  "generation_charge": number (Price to Compare Default Service amount),
  "generation_rate": number (the per kWh rate for generation),
  "customer_charge": number,
  "distribution_charge": number,
  "distribution_rate": number (per kWh rate),
  "default_service_support": number,
  "led_conversion_charge": number,
  "state_tax_surcharge": number,
  "other_charges": number (any charges not listed above),
  "total_charges": number,
  "service_address": "full service address"
}`
                    }
                ]
            }]
        })
    });

    const data = await response.json();
    const text = data.content?.map(c => c.text || '').join('') || '';
    
    // Parse JSON, strip any backticks
    const clean = text.replace(/```json|```/g, '').trim();
    const bill = JSON.parse(clean);

    // Compute derived fields
    bill.cost_per_kwh = bill.kwh_used > 0 ? +(bill.total_charges / bill.kwh_used).toFixed(4) : 0;
    bill.energy_cost = +((bill.generation_charge || 0) + (bill.distribution_charge || 0)).toFixed(2);
    bill.fees_total = +((bill.customer_charge || 0) + (bill.default_service_support || 0) + 
                       (bill.led_conversion_charge || 0) + (bill.state_tax_surcharge || 0) + 
                       (bill.other_charges || 0)).toFixed(2);
    bill.raw_ai_response = data;

    return bill;
}

async function saveBillToSupabase(bill) {
    const resp = await fetch(`${SUPABASE_URL}/rest/v1/solar_electric_bills?on_conflict=invoice_number`, {
        method: 'POST',
        headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
            'Content-Type': 'application/json',
            'Prefer': 'resolution=merge-duplicates'
        },
        body: JSON.stringify(bill)
    });
    if (!resp.ok) {
        const err = await resp.text();
        console.error('Supabase save error:', err);
    }
}

async function loadBillHistory() {
    try {
        allBills = await sbGet('solar_electric_bills', 'order=billing_period_end.desc&limit=200');
        
        // Build meter filter buttons
        const meters = [...new Set(allBills.map(b => b.meter_label).filter(Boolean))].sort();
        const btnContainer = document.getElementById('meterFilterBtns');
        btnContainer.innerHTML = meters.map(m => 
            `<button class="meter-filter-btn${activeMeterFilter === m ? ' active' : ''}" onclick="filterMeter('${m}')">${m}</button>`
        ).join('');

        renderBillsTable();
        renderBillsChart();
    } catch (err) {
        console.error('Load bills error:', err);
    }
}

function filterMeter(meter) {
    activeMeterFilter = meter;
    document.querySelectorAll('.meter-filter-btn').forEach(b => {
        b.classList.toggle('active', 
            (meter === 'all' && b.textContent === 'All Meters') || b.textContent === meter);
    });
    renderBillsTable();
    renderBillsChart();
}

function getFilteredBills() {
    if (activeMeterFilter === 'all') return allBills;
    return allBills.filter(b => b.meter_label === activeMeterFilter);
}

function renderBillsTable() {
    const bills = getFilteredBills();
    const tbody = document.getElementById('billsBody');
    
    if (bills.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" style="padding:20px;text-align:center;color:var(--sage-400);">No bills yet — upload some PDFs above!</td></tr>';
        document.getElementById('billsSummary').innerHTML = '';
        return;
    }

    tbody.innerHTML = bills.map(b => {
        const endDate = new Date(b.billing_period_end + 'T12:00:00');
        const period = endDate.toLocaleDateString('en-US', { month: 'short', year: 'numeric' });
        return `<tr style="border-bottom:1px solid var(--sage-100);">
            <td style="padding:8px 6px;">${period}</td>
            <td style="padding:8px 6px;"><span style="background:var(--sage-100);padding:2px 8px;border-radius:4px;font-size:0.8rem;font-weight:600;">${b.meter_label || '?'}</span></td>
            <td style="padding:8px 6px;text-align:right;font-weight:600;">${(b.kwh_used || 0).toLocaleString()}</td>
            <td style="padding:8px 6px;text-align:right;">$${(b.energy_cost || 0).toFixed(2)}</td>
            <td style="padding:8px 6px;text-align:right;color:var(--sage-500);">$${(b.fees_total || 0).toFixed(2)}</td>
            <td style="padding:8px 6px;text-align:right;font-weight:700;">$${(b.total_charges || 0).toFixed(2)}</td>
            <td style="padding:8px 6px;text-align:right;color:var(--sage-500);">$${(b.cost_per_kwh || 0).toFixed(4)}</td>
        </tr>`;
    }).join('');

    // Summary
    const totalKwh = bills.reduce((s, b) => s + (b.kwh_used || 0), 0);
    const totalCost = bills.reduce((s, b) => s + (b.total_charges || 0), 0);
    const totalEnergy = bills.reduce((s, b) => s + (b.energy_cost || 0), 0);
    const totalFees = bills.reduce((s, b) => s + (b.fees_total || 0), 0);
    const avgRate = totalKwh > 0 ? totalCost / totalKwh : 0;

    document.getElementById('billsSummary').innerHTML = `
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;text-align:center;">
            <div><div style="font-size:0.7rem;text-transform:uppercase;color:var(--sage-500);font-weight:700;">Total kWh</div><div style="font-family:'Crimson Pro',serif;font-size:1.4rem;font-weight:600;color:var(--sage-800);">${totalKwh.toLocaleString()}</div></div>
            <div><div style="font-size:0.7rem;text-transform:uppercase;color:var(--sage-500);font-weight:700;">Energy Cost</div><div style="font-family:'Crimson Pro',serif;font-size:1.4rem;font-weight:600;color:var(--sage-800);">$${totalEnergy.toLocaleString('en-US',{minimumFractionDigits:2})}</div></div>
            <div><div style="font-size:0.7rem;text-transform:uppercase;color:var(--sage-500);font-weight:700;">Fees & Taxes</div><div style="font-family:'Crimson Pro',serif;font-size:1.4rem;font-weight:600;color:var(--sage-800);">$${totalFees.toLocaleString('en-US',{minimumFractionDigits:2})}</div></div>
            <div><div style="font-size:0.7rem;text-transform:uppercase;color:var(--sage-500);font-weight:700;">Total Cost</div><div style="font-family:'Crimson Pro',serif;font-size:1.4rem;font-weight:600;color:var(--dusty-rose);">$${totalCost.toLocaleString('en-US',{minimumFractionDigits:2})}</div></div>
            <div><div style="font-size:0.7rem;text-transform:uppercase;color:var(--sage-500);font-weight:700;">Avg $/kWh</div><div style="font-family:'Crimson Pro',serif;font-size:1.4rem;font-weight:600;color:var(--sage-800);">$${avgRate.toFixed(4)}</div></div>
        </div>`;
}

function renderBillsChart() {
    const bills = getFilteredBills();
    if (bills.length === 0) return;

    const ctx = document.getElementById('billsCanvas').getContext('2d');
    if (billChart) billChart.destroy();

    // Group by month, sum across meters if showing all
    const byMonth = {};
    bills.forEach(b => {
        const d = new Date(b.billing_period_end + 'T12:00:00');
        const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
        if (!byMonth[key]) byMonth[key] = { kwh: 0, cost: 0, energy: 0, fees: 0 };
        byMonth[key].kwh += b.kwh_used || 0;
        byMonth[key].cost += b.total_charges || 0;
        byMonth[key].energy += b.energy_cost || 0;
        byMonth[key].fees += b.fees_total || 0;
    });

    const months = Object.keys(byMonth).sort();
    const labels = months.map(m => {
        const [y, mo] = m.split('-');
        return new Date(y, mo - 1).toLocaleDateString('en-US', { month: 'short', year: '2-digit' });
    });

    billChart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels,
            datasets: [
                { label: 'Energy Cost', data: months.map(m => byMonth[m].energy), backgroundColor: 'rgba(255,167,38,0.6)', borderRadius: 4, stack: 'cost' },
                { label: 'Fees & Taxes', data: months.map(m => byMonth[m].fees), backgroundColor: 'rgba(196,181,164,0.5)', borderRadius: 4, stack: 'cost' },
                { label: 'kWh', data: months.map(m => byMonth[m].kwh), type: 'line', borderColor: '#EF5350', backgroundColor: 'transparent', borderWidth: 2, yAxisID: 'y1', pointRadius: 4, tension: 0.3 }
            ]
        },
        options: {
            responsive: true, maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: {
                legend: { position: 'bottom', labels: { color: '#5f734c', usePointStyle: true, padding: 12, font: { family: 'Karla', size: 12 } } },
                tooltip: {
                    backgroundColor: 'rgba(74,77,71,0.95)', titleColor: '#ece8dd', bodyColor: '#c4b5a4',
                    callbacks: {
                        label: c => {
                            if (c.dataset.yAxisID === 'y1') return `${c.dataset.label}: ${c.parsed.y.toLocaleString()} kWh`;
                            return `${c.dataset.label}: $${c.parsed.y.toFixed(2)}`;
                        }
                    }
                }
            },
            scales: {
                x: { ticks: { color: '#7a9061', font: { size: 11 } }, grid: { color: 'rgba(74,77,71,0.06)' } },
                y: { position: 'left', title: { display: true, text: 'Cost ($)', color: '#7a9061' }, ticks: { color: '#7a9061', callback: v => '$' + v }, grid: { color: 'rgba(74,77,71,0.06)' }, stacked: true },
                y1: { position: 'right', title: { display: true, text: 'kWh', color: '#EF5350' }, ticks: { color: '#EF5350' }, grid: { drawOnChartArea: false } }
            }
        }
    });
}

// Load bill history on page load
loadBillHistory();
</script>
