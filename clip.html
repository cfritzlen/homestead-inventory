<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clip — Homestead Hub</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{background:#000;min-height:100vh;display:flex;flex-direction:column;font-family:sans-serif;}
        .bar{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:rgba(0,0,0,0.8);}
        .bar a{color:#c4b5a4;text-decoration:none;font-size:0.9rem;}
        .bar .title{color:#ece8dd;font-family:serif;font-size:1.1rem;}
        video{flex:1;width:100%;object-fit:contain;background:#000;}
        .loading{flex:1;display:flex;align-items:center;justify-content:center;color:#c4b5a4;font-size:1rem;}
    </style>
</head>
<body>
    <div class="bar">
        <a href="security.html">&larr; Back</a>
        <span class="title" id="title">Clip</span>
        <span></span>
    </div>
    <div class="loading" id="loading">Loading clip...</div>
    <video id="player" controls playsinline loop style="display:none;"></video>
    <script>
        const params = new URLSearchParams(location.search);
        const id = params.get('id');
        const label = params.get('label') || '';
        const camera = params.get('camera') || '';

        if (id) {
            document.getElementById('title').textContent = (label + ' — ' + camera).toUpperCase();

            const player = document.getElementById('player');
            const loading = document.getElementById('loading');

            player.addEventListener('error', () => {
                loading.textContent = 'Playback error: ' + (player.error ? player.error.message : 'unknown');
                loading.style.display = 'flex';
            });

            player.addEventListener('canplay', () => {
                loading.style.display = 'none';
                player.style.display = 'block';
            });

            // Try direct src first (works on most browsers)
            player.src = '/api/events/' + id + '/clip.mp4';
            player.load();

            // If direct fails after 5s, try blob approach
            setTimeout(() => {
                if (player.readyState < 2 && !player.error) {
                    loading.textContent = 'Buffering clip...';
                    fetch('/api/events/' + id + '/clip.mp4')
                        .then(r => r.arrayBuffer())
                        .then(buf => {
                            const blob = new Blob([buf], { type: 'video/mp4' });
                            player.src = URL.createObjectURL(blob);
                            player.load();
                        })
                        .catch(() => { loading.textContent = 'Failed to load clip'; });
                }
            }, 5000);
        }
    </script>
</body>
</html>
