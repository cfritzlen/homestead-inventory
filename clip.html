<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clip — Homestead Hub</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{background:#000;min-height:100vh;display:flex;flex-direction:column;font-family:sans-serif;}
        .bar{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:rgba(0,0,0,0.8);}
        .bar a{color:#c4b5a4;text-decoration:none;font-size:0.9rem;}
        .bar .title{color:#ece8dd;font-family:serif;font-size:1.1rem;}
        video{flex:1;width:100%;object-fit:contain;background:#000;}
        .status{flex:1;display:flex;align-items:center;justify-content:center;color:#c4b5a4;font-size:1rem;}
    </style>
</head>
<body>
    <div class="bar">
        <a href="security.html">&larr; Back</a>
        <span class="title" id="title">Clip</span>
        <span></span>
    </div>
    <div class="status" id="status">Loading clip...</div>
    <video id="player" controls playsinline loop style="display:none;"></video>
    <script>
        const params = new URLSearchParams(location.search);
        const id = params.get('id');
        const label = params.get('label') || '';
        const camera = params.get('camera') || '';
        const status = document.getElementById('status');
        const player = document.getElementById('player');

        if (id) {
            document.getElementById('title').textContent = (label + ' — ' + camera).toUpperCase();

            // Request H.264 conversion (returns cached if already done)
            status.textContent = 'Converting clip for playback...';
            fetch('/convert?id=' + encodeURIComponent(id))
                .then(r => r.json())
                .then(data => {
                    if (data.ready) {
                        player.src = data.url;
                        player.style.display = 'block';
                        status.style.display = 'none';
                        player.play().catch(() => {});
                    } else {
                        status.textContent = 'Conversion failed';
                    }
                })
                .catch(() => {
                    status.textContent = 'Failed to load clip';
                });
        }
    </script>
</body>
</html>
