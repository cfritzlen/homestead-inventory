<!DOCTYPE html>
<html lang="en">
<head>
<!-- AUTH_GATE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/auth.js"></script>
<script>
  // ?share=TOKEN is the teacher's read-only link: no login, served by the
  // color-chart-share edge function. Everything else needs a family login.
  var SHARE_TOKEN = new URLSearchParams(location.search).get('share');
  if (!SHARE_TOKEN) Auth.requireAuth();
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Color Chart">
<title>Color Chart</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚦</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { height: 100%; }
  body {
    font-family: 'Fredoka', sans-serif;
    background: linear-gradient(170deg, #F3EAFF 0%, #EDE0FF 30%, #F8F0FF 60%, #FCEAFF 100%);
    color: #2D1B4E; min-height: 100vh; padding: 0 12px 40px;
  }
  .hidden { display: none !important; }
  button { font-family: 'Fredoka', sans-serif; cursor: pointer; }

  .top { display: flex; align-items: center; justify-content: space-between; padding: 12px 0 6px; max-width: 1300px; margin: 0 auto; }
  .top a, .top button.icon { padding: 8px 14px; border-radius: 10px; border: 1.5px solid #E0CCF0; background: rgba(255,255,255,0.7); color: #9B59B6; font-size: 14px; font-weight: 600; text-decoration: none; }
  .top button.icon { font-size: 20px; padding: 6px 12px; }
  .top h1 { font-size: 22px; font-weight: 700; background: linear-gradient(135deg, #9B59B6, #8E44AD, #7D3C98); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .sync { text-align: center; font-size: 11px; color: #A88BC3; font-weight: 600; padding: 2px 0 8px; }

  .wrap { display: grid; grid-template-columns: 1fr; gap: 14px; max-width: 1300px; margin: 0 auto; }
  .wrap > * { min-width: 0; }   /* never let a wide strip stretch the page past the screen */
  .card { min-width: 0; max-width: 100%; }
  @media (min-width: 900px) { .wrap { grid-template-columns: 3fr 2fr; align-items: start; } }
  .card { background: rgba(255,255,255,0.85); backdrop-filter: blur(10px); border-radius: 18px; padding: 18px; border: 1.5px solid #E8D5F5; box-shadow: 0 2px 12px rgba(142,68,173,0.08); animation: slideUp 0.4s ease-out; margin-bottom: 14px; }
  .sec-title { font-size: 14px; font-weight: 700; color: #7D3C98; letter-spacing: 0.5px; margin-bottom: 12px; }
  @keyframes slideUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }

  /* ── who + meter ── */
  .who { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px 18px; }
  .kid-name { font-size: clamp(28px, 5vw, 48px); font-weight: 700; color: #5B2D8E; }
  .kid-date { font-size: 13px; color: #A88BC3; font-weight: 600; }
  .meter { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .meter-word small { font-size: 0.75em; opacity: 0.8; }
  .dot { width: clamp(11px, 1.7vw, 20px); height: clamp(11px, 1.7vw, 20px); border-radius: 50%; opacity: 0.35; transition: all 0.3s; }
  .dot.on { opacity: 1; transform: scale(1.45); box-shadow: 0 0 0 4px #fff, 0 0 0 6px currentColor; }
  .meter-word { font-size: clamp(14px, 2.2vw, 20px); font-weight: 700; margin-left: 6px; }

  /* ── the three circles (vertical ladder, green on top) ── */
  .chart { padding: 18px 12px; --c: min(22vw, 20vh, 190px); }
  .chart-body { display: flex; justify-content: center; align-items: stretch; gap: clamp(18px, 4vw, 48px); }
  @media (max-width: 899px) {
    .chart { --c: min(34vw, 19vh, 170px); padding: 18px 10px 16px 20px; }
    .chart-body { justify-content: flex-start; gap: 6vw; }
    .knob-col { flex: 1; min-width: 0; }
    .knob { font-size: clamp(18px, 5.5vw, 26px); padding: 12px 22px; }
    .kid-name { font-size: clamp(34px, 10vw, 48px); }
    .chore { min-height: 104px; font-size: clamp(17px, 4.6vw, 22px); }
    .btn { font-size: 18px; padding: 16px 14px; }
  }
  .ladder { position: relative; display: flex; flex-direction: column; gap: clamp(14px, 3vh, 30px); align-items: center; }
  .rail { position: absolute; top: calc(var(--c) / 2); bottom: calc(var(--c) / 2); left: 50%; width: 14px; margin-left: -7px; border-radius: 7px;
          background: linear-gradient(180deg, #5DD36B, #FFD93D 50%, #FF5A5A); opacity: 0.35; }
  .circle { position: relative; width: var(--c); height: var(--c); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: calc(var(--c) * 0.58); line-height: 1;
            transition: transform 0.4s, box-shadow 0.4s, opacity 0.4s; opacity: 0.55; box-shadow: 0 4px 14px rgba(0,0,0,0.12); }
  .circle.green  { background: #5DD36B; }
  .circle.yellow { background: #FFD93D; }
  .circle.red    { background: #FF5A5A; }
  .circle.on { opacity: 1; transform: scale(1.12); box-shadow: 0 0 0 6px #fff, 0 0 0 10px rgba(155,89,182,0.35), 0 10px 30px rgba(0,0,0,0.18); }
  .knob-rail { position: relative; width: 20px; margin: calc(var(--c) / 2) 0; border-radius: 10px; background: rgba(155,89,182,0.12); }
  .knob-rail .tick { position: absolute; left: 5px; width: 10px; height: 10px; border-radius: 50%; background: #D7B4F0; transform: translateY(-50%); }
  .knob { position: absolute; left: 50%; transform: translate(-50%, -50%); transition: top 0.6s cubic-bezier(.34,1.4,.64,1);
          padding: 10px 18px; border-radius: 30px; color: #fff; font-weight: 700; font-size: clamp(15px, 2.4vw, 24px); white-space: nowrap;
          box-shadow: 0 6px 18px rgba(0,0,0,0.2); border: 3px solid #fff; }
  .knob-col { display: flex; flex-direction: column; align-items: center; min-width: clamp(120px, 18vw, 200px); }
  .knob-hint { text-align: center; font-size: 12px; color: #A88BC3; margin-top: 14px; font-weight: 600; }

  /* ── chores / grown-ups ── */
  .chores { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .chore { border: none; border-radius: 16px; padding: 18px 10px; font-size: clamp(16px, 2vw, 22px); font-weight: 600; color: #2D1B4E;
           background: linear-gradient(135deg, #E8F8EC, #D6F3DD); border: 2px solid #A7E3B3; min-height: 92px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; transition: transform 0.15s; }
  .chore:active { transform: scale(0.96); }
  .chore .em { font-size: clamp(28px, 4vw, 44px); line-height: 1; }
  .chore.waiting { background: linear-gradient(135deg, #FFF6D6, #FFEFB8); border-color: #F5D77A; }
  .chore .wait { font-size: 12px; color: #9A7A00; font-weight: 700; }
  .grown { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 14px 18px; border-radius: 14px; border: none; font-weight: 700; font-size: 17px; transition: all 0.2s; }
  .btn:active { transform: scale(0.97); }
  .btn-up { background: linear-gradient(135deg, #5DD36B, #3DB84D); color: #fff; box-shadow: 0 3px 10px rgba(61,184,77,0.3); }
  .btn-down { background: linear-gradient(135deg, #FF7B7B, #E84A4A); color: #fff; box-shadow: 0 3px 10px rgba(232,74,74,0.3); }
  .btn-pri { background: linear-gradient(135deg, #9B59B6, #8E44AD); color: #fff; }
  .btn-out { background: none; border: 1.5px solid #9B59B6; color: #9B59B6; }
  .btn-sm { padding: 8px 14px; font-size: 14px; border-radius: 10px; }

  /* ── log ── */
  .log-row { display: flex; align-items: center; gap: 12px; padding: 10px 4px; border-bottom: 1px solid #F0E6FA; }
  .log-row:last-child { border-bottom: none; }
  .log-ic { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
  .log-ic.up { background: #E3F7E7; } .log-ic.down { background: #FDE3E3; } .log-ic.pending { background: #FFF3C4; }
  .log-main { flex: 1; min-width: 0; }
  .log-label { font-size: 16px; font-weight: 600; color: #2D1B4E; }
  .log-note { font-size: 13px; color: #5B4A6E; margin-top: 2px; }
  .log-time { font-size: 12px; color: #A88BC3; font-weight: 600; margin-top: 2px; }
  .log-x { background: none; border: none; color: #C0A3D6; font-size: 18px; padding: 4px 8px; }
  .empty { text-align: center; color: #A88BC3; padding: 18px 0; font-size: 14px; font-weight: 600; }
  .days { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
  .day { text-align: center; flex-shrink: 0; width: 48px; background: none; border: none; padding: 0; }
  .day .b { width: 34px; height: 34px; border-radius: 50%; margin: 0 auto 4px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
  .day .t { font-size: 10px; color: #A88BC3; font-weight: 700; }

  /* ── modals ── */
  .modal-bg { position: fixed; inset: 0; background: rgba(45,27,78,0.45); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 16px; animation: fade 0.2s; }
  @keyframes fade { from{opacity:0} to{opacity:1} }
  .modal { background: #fff; border-radius: 22px; padding: 22px; width: 100%; max-width: 420px; max-height: 92vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
  .modal h2 { font-size: 20px; color: #5B2D8E; margin-bottom: 14px; text-align: center; }
  .pin-dots { display: flex; justify-content: center; gap: 14px; margin: 10px 0 18px; }
  .pin-dots span { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #9B59B6; }
  .pin-dots span.f { background: #9B59B6; }
  .pin-dots.shake { animation: shake 0.4s; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-10px)} 75%{transform:translateX(10px)} }
  .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .pad button { padding: 16px 0; font-size: 24px; font-weight: 600; border-radius: 14px; border: 1.5px solid #E0CCF0; background: #FDF8FF; color: #2D1B4E; }
  .pad button:active { background: #EDE0FF; }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .opts button { padding: 14px 8px; border-radius: 12px; border: 1.5px solid #E0CCF0; background: #FDF8FF; font-size: 15px; font-weight: 600; color: #2D1B4E; }
  .opts button.sel { background: #9B59B6; color: #fff; border-color: #9B59B6; }
  .spots { display: flex; gap: 8px; }
  .spots button { flex: 1; padding: 14px 0; font-size: 20px; font-weight: 700; border-radius: 12px; border: 1.5px solid #E0CCF0; background: #FDF8FF; color: #2D1B4E; }
  .spots button.sel { background: #9B59B6; color: #fff; border-color: #9B59B6; }
  input, textarea { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1.5px solid #E0CCF0; font-size: 16px; font-family: 'Fredoka', sans-serif; color: #2D1B4E; background: #FDF8FF; outline: none; }
  input:focus, textarea:focus { border-color: #9B59B6; }
  .label { display: block; font-size: 11px; font-weight: 700; color: #A88BC3; text-transform: uppercase; letter-spacing: 0.6px; margin: 12px 0 5px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row > * { flex: 1; }
  .row > .btn { flex: 0 0 auto; }
  .list-item { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid #F0E6FA; font-size: 15px; }
  .list-item span { flex: 1; }
  .switch { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; font-size: 15px; font-weight: 600; }
  .switch input { width: 22px; height: 22px; }
  .share-box { font-size: 12px; word-break: break-all; color: #7D3C98; background: #F8F0FF; padding: 10px; border-radius: 10px; margin-bottom: 8px; }
  .banner { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: linear-gradient(135deg, #9B59B6, #8E44AD); color: #FFF; padding: 12px 24px; border-radius: 14px; font-size: 16px; font-weight: 600; z-index: 9999; box-shadow: 0 4px 20px rgba(142,68,173,0.35); animation: slideUp 0.3s ease-out; white-space: nowrap; }
  .celebration-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9998; overflow: hidden; }
  .confetti-piece { position: absolute; width: 10px; height: 10px; border-radius: 2px; animation: confettiFall 2.5s ease-in forwards; }
  @keyframes confettiFall { 0%{transform:translateY(-20px) rotate(0deg);opacity:1} 100%{transform:translateY(100vh) rotate(720deg);opacity:0} }
  .tag { display: inline-block; font-size: 11px; font-weight: 700; color: #7D3C98; background: #F0E6FA; padding: 2px 8px; border-radius: 10px; vertical-align: middle; }
  .wsel { font-family: 'Fredoka', sans-serif; font-size: 13px; padding: 6px 4px; border-radius: 8px; border: 1.5px solid #E0CCF0; background: #FDF8FF; color: #2D1B4E; }
  .teacher-only { display: none; }
  .teacher .teacher-only { display: block; }
  .naps { display: flex; justify-content: space-between; gap: 6px; }
  .nap { flex: 1; background: none; border: none; padding: 6px 0; text-align: center; border-radius: 14px; transition: transform 0.15s; }
  .nap:active { transform: scale(0.95); }
  .nap .u { font-size: clamp(34px, 6vw, 64px); line-height: 1.1; display: block; filter: grayscale(1) opacity(0.28); transition: filter 0.3s, transform 0.3s; }
  .nap.yes .u { filter: none; transform: scale(1.08); }
  .nap.no .u { filter: grayscale(1) opacity(0.5); }
  .nap .d { font-size: 12px; font-weight: 700; color: #A88BC3; margin-top: 2px; }
  .nap.yes .d { color: #7D3C98; }
  .nap .m { font-size: 11px; font-weight: 600; color: #C0A3D6; }
  .nap.no .m { color: #E84A4A; }
  .nap.yes .m { color: #3DB84D; }
  .nap-sum { text-align: center; font-size: 14px; font-weight: 700; color: #7D3C98; margin-top: 8px; }
  .nap-sum small { display: block; font-size: 12px; color: #A88BC3; font-weight: 600; margin-top: 2px; }
  .teacher-note { text-align: center; font-size: 13px; color: #A88BC3; font-weight: 600; padding: 6px 0 12px; }
</style>
</head>
<body>

<div class="top">
  <a href="kids-hub.html" id="back-link">← Kids Hub</a>
  <h1>🚦 Color Chart</h1>
  <button class="icon" id="gear-btn" onclick="openSettings()" title="Settings">⚙</button>
</div>
<div id="sync" class="sync">Loading…</div>
<div id="teacher-note" class="teacher-note hidden">Shared from home · updates on its own</div>

<div class="wrap">
  <div class="main">
    <div class="card who">
      <div>
        <div class="kid-name" id="kid-name">…</div>
        <div class="kid-date" id="kid-date"></div>
      </div>
      <div class="meter" id="meter"></div>
    </div>

    <div class="card chart">
      <div class="chart-body">
        <div class="ladder">
          <div class="rail"></div>
          <div class="circle green" id="c-green">😊</div>
          <div class="circle yellow" id="c-yellow">😐</div>
          <div class="circle red" id="c-red">☹️</div>
        </div>
        <div class="knob-col">
          <div class="knob-rail" id="knob-rail" style="flex:1">
            <div id="ticks"></div>
            <div class="knob" id="knob" style="top:0%">…</div>
          </div>
        </div>
      </div>
      <div class="knob-hint" id="knob-hint"></div>
    </div>

    <div class="card">
      <div class="sec-title">🦄 Nap Unicorns <span style="font-weight:600;color:#A88BC3;font-size:12px">· a nap at school keeps one</span></div>
      <div class="naps" id="naps"></div>
      <div class="nap-sum" id="nap-sum"></div>
    </div>

    <div class="card teacher-only">
      <div class="sec-title">🏫 From daycare</div>
      <div class="grown">
        <button class="btn btn-up" onclick="teacherAdd('up')">⬆️ Move up</button>
        <button class="btn btn-down" onclick="teacherAdd('down')">⬇️ Move down</button>
      </div>
    </div>

    <div class="card">
      <div class="sec-title">📝 Today</div>
      <div id="log"></div>
    </div>

    <div class="card family-only" id="days-card">
      <div class="sec-title">📅 Past days</div>
      <div class="days" id="days"></div>
    </div>
  </div>

  <div class="side family-only">
    <div class="card">
      <div class="sec-title">⬆️ Ways to move up</div>
      <div class="chores" id="chores"></div>
      <div class="knob-hint" style="margin-top:12px">Tap one when you did it, then a grown-up says yes</div>
    </div>
    <div class="card">
      <div class="sec-title">🔒 Grown-ups (PIN)</div>
      <div class="grown">
        <button class="btn btn-up" onclick="parentUp()">⬆️ Move up</button>
        <button class="btn btn-down" onclick="parentDown()">⬇️ Move down</button>
      </div>
    </div>
  </div>
</div>

<div id="modal-root"></div>

<script>
// ═══ CONSTANTS ═══
var FN_SHARE = 'https://jzpipxvxrtdhmsdkveog.supabase.co/functions/v1/color-chart-share';
var MAX = 10;   // spots on the ladder; every morning starts at MAX
var LEVEL_COLORS = { 10:'#2EAF48', 9:'#4CC05A', 8:'#7BCB4C', 7:'#A8D43E', 6:'#D5D62F', 5:'#F2C21B', 4:'#FFA62B', 3:'#FF7F3A', 2:'#F25A4A', 1:'#E84A4A' };
var LEVEL_WORDS  = { 10:'Super Green', 9:'Green', 8:'Green', 7:'Green-Yellow', 6:'Yellow', 5:'Yellow', 4:'Orange', 3:'Red-Orange', 2:'Red', 1:'Red' };
function levelInfo(n) {
  return { word: LEVEL_WORDS[n], color: LEVEL_COLORS[n], zone: n >= 8 ? 'green' : n >= 4 ? 'yellow' : 'red', pos: (MAX - n) / (MAX - 1) * 100 };
}
var SEED_UP   = [['🛏️','Cleaned my room'],['🪥','Brushed teeth'],['🧸','Put toys away'],['🍽️','Helped with dinner'],['💛','Was kind']];
var SEED_DOWN = [['👂','Not listening'],['🗣️','Not nice words'],['✋','Hitting'],['😤','Screaming'],['🧹','Would not clean up']];

var kid = null, actions = [], events = [], level = MAX, pollTimer = null, daysCache = {};
var supa = (window.Auth && Auth.client) || null;

// ═══ HELPERS ═══
function todayStr() { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function dayStr(d) { return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function fmtTime(iso) { return new Date(iso).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) { return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; }); }
function setSync(t, c) { var el = document.getElementById('sync'); el.textContent = t; el.style.color = c || '#A88BC3'; }
function showBanner(msg) { var b = document.createElement('div'); b.className = 'banner'; b.innerHTML = msg; document.body.appendChild(b); setTimeout(function() { b.remove(); }, 2500); }
function confetti() {
  var o = document.createElement('div'); o.className = 'celebration-overlay'; document.body.appendChild(o);
  var colors = ['#9B59B6','#E74C9B','#FFD93D','#6BCB77','#4D96FF','#FF6B9D','#FFA94D','#B388FF'];
  for (var i = 0; i < 70; i++) { var p = document.createElement('div'); p.className = 'confetti-piece'; p.style.left = Math.random()*100+'%'; p.style.top = '-10px'; p.style.background = colors[Math.floor(Math.random()*colors.length)]; p.style.animationDelay = Math.random()*0.8+'s'; p.style.animationDuration = (2+Math.random()*1.5)+'s'; p.style.width = (6+Math.random()*10)+'px'; p.style.height = (6+Math.random()*10)+'px'; p.style.borderRadius = Math.random()>0.5?'50%':'2px'; o.appendChild(p); }
  setTimeout(function() { o.remove(); }, 3500);
}
async function sha(s) {
  if (!(window.crypto && crypto.subtle)) return 'plain:' + s;   // file:// fallback
  var b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return Array.from(new Uint8Array(b)).map(function(x) { return x.toString(16).padStart(2,'0'); }).join('');
}
function pinHash(pin) { return sha('color-chart:' + pin); }
// Walk the day in order, clamping at every step: an extra "up" while already
// at super green does not bank against a later "down".
function levelFrom(rows) {
  var lvl = MAX;
  rows.filter(function(e) { return e.status === 'approved'; })
    .sort(function(a, b) { return new Date(a.at) - new Date(b.at); })
    .forEach(function(e) { lvl = Math.max(1, Math.min(MAX, lvl + (e.kind === 'up' ? 1 : -1) * (e.weight || 1))); });
  return lvl;
}

// ── Nap unicorns: Mon-Fri of the week containing `d` ──
function weekDays(d) {
  var dow = (d.getDay() + 6) % 7; var mon = new Date(d); mon.setDate(d.getDate() - dow); mon.setHours(12,0,0,0);
  var out = []; for (var i = 0; i < 5; i++) { var x = new Date(mon); x.setDate(mon.getDate() + i); out.push(x); }
  return out;
}
var naps = [], lastWeekNaps = null;
function renderNaps(rows, family) {
  var today = todayStr(), byDay = {}; (rows || []).forEach(function(n) { byDay[n.day] = n.napped; });
  var kept = 0, html = '';
  weekDays(new Date()).forEach(function(d) {
    var key = dayStr(d), v = byDay[key], cls = v === true ? 'yes' : v === false ? 'no' : '';
    if (v === true) kept++;
    var mark = v === true ? 'Nap ✓' : v === false ? 'No nap' : (key < today ? 'Not marked' : key === today ? 'Today' : '');
    html += '<button class="nap ' + cls + '" onclick="markNap(\'' + key + '\')"><span class="u">🦄</span><div class="d">' + d.toLocaleDateString('en-US', { weekday: 'short' }) + '</div><div class="m">' + mark + '</div></button>';
  });
  document.getElementById('naps').innerHTML = html;
  document.getElementById('nap-sum').innerHTML = kept + ' of 5 unicorns this week' + (lastWeekNaps != null ? '<small>Last week: ' + lastWeekNaps + ' 🦄</small>' : '') +
    (family ? '<small>Tap a day to mark it (PIN)</small>' : '<small>Tap a day to mark her nap</small>');
}
// Tap a unicorn: Nap / No nap / Clear. Family needs the PIN; the teacher's link is her key.
async function markNap(key) {
  if (!SHARE_TOKEN && !(await askPin('Mark a nap'))) return;
  var nice = new Date(key + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
  var choice = await new Promise(function(resolve) {
    var bg = openModal('<h2>🦄 ' + esc(nice) + '</h2><div class="opts" style="grid-template-columns:1fr">' +
      '<button data-v="yes" style="font-size:18px;padding:18px">😴 She napped 🦄</button><button data-v="no" style="font-size:18px;padding:18px">🙈 No nap today</button><button data-v="clear">Clear</button></div>' +
      '<button class="btn btn-out" id="np-cancel" style="width:100%">Cancel</button>');
    bg.querySelector('.opts').addEventListener('click', function(ev) { var b = ev.target.closest('button'); if (!b) return; closeModal(bg); resolve(b.getAttribute('data-v')); });
    bg.querySelector('#np-cancel').onclick = function() { closeModal(bg); resolve(null); };
  });
  if (!choice) return;
  var napped = choice === 'yes' ? true : choice === 'no' ? false : null;
  if (SHARE_TOKEN) {
    var ok = await teacherRefresh({ action: 'nap', nap_day: key, napped: napped });
    if (!ok) { showBanner('Could not save 😕'); return; }
  } else {
    var r = napped === null
      ? await supa.from('color_chart_naps').delete().eq('kid_id', kid.id).eq('day', key)
      : await supa.from('color_chart_naps').upsert({ kid_id: kid.id, day: key, napped: napped, source: 'home' }, { onConflict: 'kid_id,day' });
    if (r.error) { showBanner('Could not save 😕'); console.error(r.error); return; }
    await refresh();
  }
  if (napped === true) { confetti(); showBanner('🦄 Unicorn kept!'); }
}

// ═══ RENDER ═══
function renderKid(name, lvl) {
  var L = levelInfo(lvl);
  document.getElementById('kid-name').textContent = name;
  document.getElementById('kid-date').textContent = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
  var m = '';
  for (var n = MAX; n >= 1; n--) m += '<div class="dot' + (n === lvl ? ' on' : '') + '" style="background:' + LEVEL_COLORS[n] + ';color:' + LEVEL_COLORS[n] + '"></div>';
  m += '<div class="meter-word" style="color:' + L.color + '">' + L.word + ' <small>' + lvl + '/' + MAX + '</small></div>';
  document.getElementById('meter').innerHTML = m;
  ['green','yellow','red'].forEach(function(c) { document.getElementById('c-' + c).classList.toggle('on', L.zone === c); });
  var k = document.getElementById('knob'); k.style.top = L.pos + '%'; k.style.background = L.color; k.textContent = '⭐ ' + name;
  document.getElementById('knob-hint').textContent = 'Spot ' + lvl + ' of ' + MAX;
}
function renderLog(rows, family) {
  var el = document.getElementById('log');
  var shown = rows.filter(function(e) { return e.status !== 'denied'; });
  if (!shown.length) { el.innerHTML = '<div class="empty">Nothing yet today. Fresh start! 🌱</div>'; return; }
  el.innerHTML = shown.map(function(e) {
    var pending = e.status === 'pending';
    var ic = pending ? '⏳' : (e.kind === 'up' ? '⬆️' : '⬇️');
    var cls = pending ? 'pending' : e.kind;
    var right = '';
    if (family && pending) right = '<button class="btn btn-pri btn-sm" onclick="approve(' + e.id + ')">Yes ✓</button> <button class="btn btn-out btn-sm" onclick="deny(' + e.id + ')">Not yet</button>';
    else if (family) right = '<button class="log-x" onclick="removeEvent(' + e.id + ')" title="Remove">✕</button>';
    return '<div class="log-row"><div class="log-ic ' + cls + '">' + ic + '</div><div class="log-main">' +
      '<div class="log-label">' + esc(e.label) + (pending ? ' <span style="color:#9A7A00;font-size:12px">· waiting for a grown-up</span>' : '') +
        (e.source === 'teacher' ? ' <span class="tag">🏫 Teacher</span>' : '') + ((e.weight || 1) > 1 ? ' <span class="tag">' + (e.weight) + ' spots</span>' : '') + '</div>' +
      (e.note ? '<div class="log-note">' + esc(e.note) + '</div>' : '') +
      '<div class="log-time">' + fmtTime(e.at) + '</div></div><div>' + right + '</div></div>';
  }).join('');
}
function renderChores() {
  var el = document.getElementById('chores');
  var ups = actions.filter(function(a) { return a.kind === 'up' && a.active; });
  if (!ups.length) { el.innerHTML = '<div class="empty">Add chores in ⚙ settings</div>'; return; }
  el.innerHTML = ups.map(function(a) {
    var pend = events.find(function(e) { return e.status === 'pending' && e.label === a.label; });
    if (pend) return '<button class="chore waiting" onclick="approve(' + pend.id + ')"><div class="em">⏳</div>' + esc(a.label) + '<div class="wait">Waiting for a grown-up · tap to say yes</div></button>';
    return '<button class="chore" onclick="kidTap(' + a.id + ')"><div class="em">' + esc(a.emoji || '⭐') + '</div>' + esc(a.label) + ((a.weight || 1) > 1 ? '<div class="wait" style="color:#3DB84D">' + a.weight + ' spots!</div>' : '') + '</button>';
  }).join('');
}
function renderDays(rowsByDay) {
  daysCache = rowsByDay;
  var el = document.getElementById('days'), out = '';
  for (var i = 13; i >= 1; i--) {
    var d = new Date(); d.setDate(d.getDate() - i); var key = dayStr(d);
    var rows = rowsByDay[key], wd = d.toLocaleDateString('en-US', { weekday: 'short' }), dn = d.getDate();
    if (!rows || !rows.length) { out += '<button class="day" onclick="openDay(\'' + key + '\')"><div class="b" style="background:#F0E6FA"></div><div class="t">' + wd + ' ' + dn + '</div></button>'; continue; }
    var L = levelInfo(levelFrom(rows));
    out += '<button class="day" onclick="openDay(\'' + key + '\')" title="' + key + ': ' + L.word + '"><div class="b" style="background:' + L.color + '">' + (L.zone === 'green' ? '😊' : L.zone === 'red' ? '☹️' : '😐') + '</div><div class="t">' + wd + ' ' + dn + '</div></button>';
  }
  el.innerHTML = out;
}
// Tap a past day: see that day's log and add what happened (PIN).

    '<div class="grown" style="margin-bottom:12px"><button class="btn btn-up" onclick="pastAdd(\'' + key + '\', \'up\')">⬆️ Add up</button><button class="btn btn-down" onclick="pastAdd(\'' + key + '\', \'down\')">⬇️ Add down</button></div>' +
    '<div id="day-log">' + (rows.length ? rows.map(function(e) {
      return '<div class="log-row"><div class="log-ic ' + e.kind + '">' + (e.kind === 'up' ? '⬆️' : '⬇️') + '</div><div class="log-main"><div class="log-label">' + esc(e.label) +
        (e.source === 'teacher' ? ' <span class="tag">🏫 Teacher</span>' : '') + ((e.weight || 1) > 1 ? ' <span class="tag">' + e.weight + ' spots</span>' : '') + '</div>' +
        (e.note ? '<div class="log-note">' + esc(e.note) + '</div>' : '') + '<div class="log-time">' + fmtTime(e.at) + '</div></div>' +

  bg.id = 'day-bg';
}
async function pastAdd(key, kind) {
  if (!(await askPin(kind === 'up' ? 'Add an up' : 'Add a down'))) return;
  var opts = actions.filter(function(a) { return a.kind === kind && a.active; });
  var c = await askChoice(kind === 'up' ? 'What did she do?' : 'What happened?', opts, true, 'Details (optional)', key); if (!c) return;
  var r = await supa.from('color_chart_events').insert({ kid_id: kid.id, day: key, at: c.at, kind: kind, status: 'approved', label: c.label, note: c.note || null, weight: c.weight }).select().single();
  if (r.error) { showBanner('Could not save 😕'); console.error(r.error); return; }
  showBanner('Added ✓'); await refresh(); openDay(key);
}
async function pastRemove(id, key) {
  if (!(await askPin('Remove this?'))) return;
  await supa.from('color_chart_events').delete().eq('id', id);
  await refresh(); openDay(key);
}

// ═══ MODALS ═══
function openModal(html) { var r = document.getElementById('modal-root'); var bg = document.createElement('div'); bg.className = 'modal-bg'; bg.innerHTML = '<div class="modal">' + html + '</div>'; r.appendChild(bg); return bg; }
function closeModal(bg) { if (bg && bg.parentNode) bg.parentNode.removeChild(bg); }

// Big number pad. Resolves true when the PIN matches, false if cancelled.
function askPin(title) {
  return new Promise(function(resolve) {
    var entered = '';
    var bg = openModal('<h2>' + esc(title || 'Grown-up PIN') + '</h2><div class="pin-dots" id="pd"><span></span><span></span><span></span><span></span></div>' +
      '<div class="pad">' + [1,2,3,4,5,6,7,8,9].map(function(n) { return '<button data-n="' + n + '">' + n + '</button>'; }).join('') +
      '<button data-n="x">Cancel</button><button data-n="0">0</button><button data-n="b">⌫</button></div>');
    function draw() { var d = bg.querySelectorAll('#pd span'); d.forEach(function(s, i) { s.classList.toggle('f', i < entered.length); }); }
    bg.querySelector('.pad').addEventListener('click', async function(ev) {
      var b = ev.target.closest('button'); if (!b) return; var n = b.getAttribute('data-n');
      if (n === 'x') { closeModal(bg); resolve(false); return; }
      if (n === 'b') { entered = entered.slice(0, -1); draw(); return; }
      if (entered.length >= 4) return;
      entered += n; draw();
      if (entered.length === 4) {
        var ok = (await pinHash(entered)) === kid.pin_hash;
        if (ok) { closeModal(bg); resolve(true); return; }
        var pd = bg.querySelector('#pd'); pd.classList.add('shake'); setTimeout(function() { pd.classList.remove('shake'); entered = ''; draw(); }, 400);
      }
    });
  });
}

// Pick a chore / reason, how many spots, optional note (and a time when
// filling in a past day). Resolves {label, note, weight, at} or null.
function spotsRow(def) { return '<span class="label">How many spots?</span><div class="spots" id="spots">' + [1,2,3,4,5].map(function(n) { return '<button data-n="' + n + '"' + (n === def ? ' class="sel"' : '') + '>' + n + '</button>'; }).join('') + '</div>'; }
function askChoice(title, opts, withNote, extraLabel, pastDay) {
  return new Promise(function(resolve) {
    var sel = null, spots = 1;
    var bg = openModal('<h2>' + esc(title) + '</h2><div class="opts">' +
      opts.map(function(o, i) { return '<button data-i="' + i + '">' + esc((o.emoji ? o.emoji + ' ' : '') + o.label) + '</button>'; }).join('') +
      '<button data-i="other">✏️ Other…</button></div>' +
      '<div id="other-wrap" class="hidden"><input id="other-txt" placeholder="What was it?" maxlength="60"></div>' +
      spotsRow(1) +
      (pastDay ? '<span class="label">What time?</span><input type="time" id="at-txt" value="12:00">' : '') +
      (withNote ? '<span class="label">' + esc(extraLabel || 'Note (optional)') + '</span><textarea id="note-txt" rows="2" placeholder="What happened?"></textarea>' : '') +
      '<div class="row" style="margin-top:14px"><button class="btn btn-out" id="ch-cancel">Cancel</button><button class="btn btn-pri" id="ch-ok">Save</button></div>');
    function setSpots(n) { spots = n; bg.querySelectorAll('#spots button').forEach(function(x) { x.classList.toggle('sel', +x.getAttribute('data-n') === n); }); }
    bg.querySelector('.opts').addEventListener('click', function(ev) {
      var b = ev.target.closest('button'); if (!b) return;
      bg.querySelectorAll('.opts button').forEach(function(x) { x.classList.remove('sel'); }); b.classList.add('sel');
      sel = b.getAttribute('data-i');
      bg.querySelector('#other-wrap').classList.toggle('hidden', sel !== 'other');
      setSpots(sel === 'other' ? 1 : Math.min(5, opts[+sel].weight || 1));
      if (sel === 'other') bg.querySelector('#other-txt').focus();
    });
    bg.querySelector('#spots').addEventListener('click', function(ev) { var b = ev.target.closest('button'); if (b) setSpots(+b.getAttribute('data-n')); });
    bg.querySelector('#ch-cancel').onclick = function() { closeModal(bg); resolve(null); };
    bg.querySelector('#ch-ok').onclick = function() {
      var label = sel === 'other' ? bg.querySelector('#other-txt').value.trim() : (sel != null ? opts[+sel].label : '');
      if (!label) { showBanner('Pick one first'); return; }
      var note = withNote ? bg.querySelector('#note-txt').value.trim() : '';
      var at = pastDay ? new Date(pastDay + 'T' + (bg.querySelector('#at-txt').value || '12:00') + ':00').toISOString() : new Date().toISOString();
      closeModal(bg); resolve({ label: label, note: note, weight: spots, at: at });
    };
  });
}
// Just "how many spots?" (approving a chore the kid tapped). Resolves a number or null.
function askSpots(def) {
  return new Promise(function(resolve) {
    var spots = def || 1;
    var bg = openModal('<h2>How many spots?</h2>' + spotsRow(spots) + '<div class="row" style="margin-top:14px"><button class="btn btn-out" id="sp-cancel">Cancel</button><button class="btn btn-pri" id="sp-ok">Yes ✓</button></div>');
    bg.querySelector('#spots').addEventListener('click', function(ev) { var b = ev.target.closest('button'); if (!b) return; spots = +b.getAttribute('data-n'); bg.querySelectorAll('#spots button').forEach(function(x) { x.classList.toggle('sel', +x.getAttribute('data-n') === spots); }); });
    bg.querySelector('#sp-cancel').onclick = function() { closeModal(bg); resolve(null); };
    bg.querySelector('#sp-ok').onclick = function() { closeModal(bg); resolve(spots); };
  });
}

// ═══ FAMILY MODE: DATA ═══
async function loadAll() {
  var k = await supa.from('color_chart_kids').select('*').order('created_at').limit(1);
  if (k.error) { setSync('Not set up yet: run the migration', '#E84A4A'); console.error(k.error); return; }
  if (!k.data.length) { await firstTimeSetup(); return; }
  kid = k.data[0];
  var a = await supa.from('color_chart_actions').select('*').eq('kid_id', kid.id).order('sort').order('id');
  actions = a.data || [];
  await refresh();
  renderChores();
  setSync('Synced 🦄', '#9B59B6');
}
async function refresh() {
  var today = todayStr();
  var e = await supa.from('color_chart_events').select('*').eq('kid_id', kid.id).eq('day', today).order('at', { ascending: false });
  if (e.error) { setSync('Sync problem', '#E84A4A'); return; }
  events = e.data || [];
  level = levelFrom(events);
  renderKid(kid.name, level);
  renderLog(events, true);
  renderChores();
  var since = new Date(); since.setDate(since.getDate() - 13);
  var h = await supa.from('color_chart_events').select('day,kind,status').eq('kid_id', kid.id).eq('status', 'approved').gte('day', dayStr(since)).lt('day', today);
  var byDay = {}; (h.data || []).forEach(function(r) { (byDay[r.day] = byDay[r.day] || []).push(r); });
  renderDays(byDay);
  var wk = weekDays(new Date()), lastMon = new Date(wk[0]); lastMon.setDate(lastMon.getDate() - 7);
  var n = await supa.from('color_chart_naps').select('day,napped').eq('kid_id', kid.id).gte('day', dayStr(lastMon)).lte('day', dayStr(wk[4]));
  var all = n.data || [], monKey = dayStr(wk[0]);
  naps = all.filter(function(x) { return x.day >= monKey; });
  var lw = all.filter(function(x) { return x.day < monKey; });
  lastWeekNaps = lw.length ? lw.filter(function(x) { return x.napped; }).length : null;
  renderNaps(naps, true);
}
async function addEvent(kind, status, label, note, weight) {
  var r = await supa.from('color_chart_events').insert({ kid_id: kid.id, day: todayStr(), kind: kind, status: status, label: label, note: note || null, weight: weight || 1 }).select().single();
  if (r.error) { showBanner('Could not save 😕'); console.error(r.error); return null; }
  await refresh();
  return r.data;
}

// Kid taps a chore: no PIN, goes in as "waiting"
async function kidTap(actionId) {
  var a = actions.find(function(x) { return x.id === actionId; }); if (!a) return;
  if (events.some(function(e) { return e.status === 'pending' && e.label === a.label; })) { showBanner('Already waiting for a grown-up ⏳'); return; }
  var r = await addEvent('up', 'pending', a.label, '', a.weight || 1);
  if (r) showBanner('Nice! Now a grown-up needs to say yes 💜');
}
async function approve(eventId) {
  if (!(await askPin('Say yes?'))) return;
  var ev = events.find(function(e) { return e.id === eventId; });
  var spots = await askSpots(Math.min(5, (ev && ev.weight) || 1)); if (!spots) return;
  var before = level;
  var r = await supa.from('color_chart_events').update({ status: 'approved', at: new Date().toISOString(), weight: spots }).eq('id', eventId);
  if (r.error) { showBanner('Could not save 😕'); return; }
  await refresh();
  confetti(); showBanner(level > before ? '⬆️ Moved up to ' + levelInfo(level).word + '!' : '⭐ Already at the top!');
}
async function deny(eventId) {
  if (!(await askPin('Not yet?'))) return;
  await supa.from('color_chart_events').update({ status: 'denied' }).eq('id', eventId);
  await refresh();
}
async function removeEvent(eventId) {
  if (!(await askPin('Remove this?'))) return;
  await supa.from('color_chart_events').delete().eq('id', eventId);
  await refresh();
}
async function parentUp() {
  if (!(await askPin('Move up'))) return;
  var opts = actions.filter(function(a) { return a.kind === 'up' && a.active; });
  var c = await askChoice('What did she do?', opts, false); if (!c) return;
  var before = level;
  if (await addEvent('up', 'approved', c.label, c.note, c.weight)) { confetti(); showBanner(level > before ? '⬆️ Moved up to ' + levelInfo(level).word + '!' : '⭐ Already at the top!'); }
}
async function parentDown() {
  if (!(await askPin('Move down'))) return;
  var opts = actions.filter(function(a) { return a.kind === 'down' && a.active; });
  var c = await askChoice('What happened?', opts, true, 'Details (optional)'); if (!c) return;
  var before = level;
  if (await addEvent('down', 'approved', c.label, c.note, c.weight)) showBanner(level < before ? '⬇️ Moved down to ' + levelInfo(level).word : 'Already at red');
}

// ═══ FIRST-TIME SETUP ═══
function firstTimeSetup() {
  return new Promise(function(resolve) {
    var bg = openModal('<h2>🚦 Set up the Color Chart</h2>' +
      '<span class="label">Kid\'s name</span><input id="su-name" placeholder="Name" maxlength="30">' +
      '<span class="label">Grown-up PIN (4 numbers)</span><input id="su-pin" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="1234">' +
      '<span class="label">PIN again</span><input id="su-pin2" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="1234">' +
      '<div class="knob-hint" style="margin-top:12px;text-align:left">The PIN is needed to move up or down. Starter chores and reasons get added; change them in ⚙ later.</div>' +
      '<button class="btn btn-pri" id="su-go" style="width:100%;margin-top:14px">Let\'s go 🦄</button>');
    bg.querySelector('#su-go').onclick = async function() {
      var name = bg.querySelector('#su-name').value.trim(), pin = bg.querySelector('#su-pin').value.trim(), pin2 = bg.querySelector('#su-pin2').value.trim();

      if (!/^\d{4}$/.test(pin)) { showBanner('PIN must be 4 numbers'); return; }
      if (pin !== pin2) { showBanner('PINs do not match'); return; }
      var r = await supa.from('color_chart_kids').insert({ name: name, pin_hash: await pinHash(pin) }).select().single();
      if (r.error) { showBanner('Could not save 😕'); console.error(r.error); return; }
      var rows = SEED_UP.map(function(s, i) { return { kid_id: r.data.id, kind: 'up', emoji: s[0], label: s[1], sort: i }; })
        .concat(SEED_DOWN.map(function(s, i) { return { kid_id: r.data.id, kind: 'down', emoji: s[0], label: s[1], sort: i }; }));
      await supa.from('color_chart_actions').insert(rows);
      closeModal(bg); await loadAll(); resolve();
    };
  });
}

// ═══ SETTINGS ═══
async function openSettings() {
  if (!kid) return;
  if (!(await askPin('Settings'))) return;
  var bg = openModal('<h2>⚙ Settings</h2>' +
    '<span class="label">Kid\'s name</span><div class="row"><input id="st-name" value="' + esc(kid.name) + '" maxlength="30"><button class="btn btn-pri btn-sm" onclick="saveName()">Save</button></div>' +
    '<span class="label">Chores (move up) · usual spots, you can change it each time</span><div id="st-up"></div><div class="row" style="margin-top:6px"><input id="new-up-em" placeholder="⭐" maxlength="4" style="flex:0 0 58px;text-align:center"><input id="new-up" placeholder="New chore" maxlength="40">' + weightSelect(1, 'id="new-up-w" style="flex:0 0 92px"') + '<button class="btn btn-pri btn-sm" onclick="addAction(\'up\')">Add</button></div>' +
    '<span class="label">Reasons (move down)</span><div id="st-down"></div><div class="row" style="margin-top:6px"><input id="new-down-em" placeholder="⭐" maxlength="4" style="flex:0 0 58px;text-align:center"><input id="new-down" placeholder="New reason" maxlength="40">' + weightSelect(1, 'id="new-down-w" style="flex:0 0 92px"') + '<button class="btn btn-pri btn-sm" onclick="addAction(\'down\')">Add</button></div>' +
    '<span class="label">Teacher link</span><div class="share-box" id="share-url"></div>' +
    '<div class="row"><button class="btn btn-out btn-sm" onclick="copyShare()">📋 Copy link</button><button class="btn btn-out btn-sm" onclick="newShare()">🔄 New link</button></div>' +
    '<div class="switch"><span>Teacher sees today\'s log</span><input type="checkbox" id="st-reasons" ' + (kid.share_reasons ? 'checked' : '') + ' onchange="saveShareReasons(this.checked)"></div>' +
    '<div class="knob-hint" style="text-align:left;margin-top:0">Off = the teacher only sees the color and how many ups and downs. Either way the teacher can add an up or down from daycare.</div>' +
    '<span class="label">Change PIN</span><div class="row"><input id="st-pin" inputmode="numeric" maxlength="4" placeholder="New 4-digit PIN"><button class="btn btn-pri btn-sm" onclick="savePin()">Save</button></div>' +
    '<button class="btn btn-out" style="width:100%;margin-top:18px" onclick="closeSettings()">Done</button>');
  bg.id = 'settings-bg';
  renderSettingsLists();
}
function closeSettings() { closeModal(document.getElementById('settings-bg')); renderChores(); }
function shareUrl() { return location.origin + location.pathname + '?share=' + kid.share_token; }
function renderSettingsLists() {
  ['up','down'].forEach(function(k) {
    var el = document.getElementById('st-' + k); if (!el) return;
    var rows = actions.filter(function(a) { return a.kind === k && a.active; });
    el.innerHTML = rows.length ? rows.map(function(a) { return '<div class="list-item">' + esc(a.emoji || '') + '<span>' + esc(a.label) + '</span>' + weightSelect(a.weight || 1, 'onchange="setWeight(' + a.id + ', this.value)"') + '<button class="log-x" onclick="removeAction(' + a.id + ')">✕</button></div>'; }).join('') : '<div class="empty">None yet</div>';
  });
  var s = document.getElementById('share-url'); if (s) s.textContent = shareUrl();
}
async function saveName() {
  var name = document.getElementById('st-name').value.trim(); if (!name) return;
  var r = await supa.from('color_chart_kids').update({ name: name }).eq('id', kid.id);
  if (r.error) { showBanner('Could not save 😕'); return; }
  kid.name = name; renderKid(kid.name, level); showBanner('Saved ✓');
}
async function savePin() {
  var pin = document.getElementById('st-pin').value.trim();
  if (!/^\d{4}$/.test(pin)) { showBanner('PIN must be 4 numbers'); return; }
  var h = await pinHash(pin);
  var r = await supa.from('color_chart_kids').update({ pin_hash: h }).eq('id', kid.id);
  if (r.error) { showBanner('Could not save 😕'); return; }
  kid.pin_hash = h; document.getElementById('st-pin').value = ''; showBanner('PIN changed ✓');
}
async function saveShareReasons(on) {
  var r = await supa.from('color_chart_kids').update({ share_reasons: on }).eq('id', kid.id);
  if (r.error) { showBanner('Could not save 😕'); return; }
  kid.share_reasons = on; showBanner('Saved ✓');
}
async function addAction(kind) {
  var label = document.getElementById('new-' + kind).value.trim(), em = document.getElementById('new-' + kind + '-em').value.trim();
  if (!label) return;
  var w = +document.getElementById('new-' + kind + '-w').value || 1;
  var r = await supa.from('color_chart_actions').insert({ kid_id: kid.id, kind: kind, label: label, emoji: em || null, weight: w, sort: actions.length }).select().single();
  if (r.error) { showBanner('Could not save 😕'); return; }
  actions.push(r.data); document.getElementById('new-' + kind).value = ''; document.getElementById('new-' + kind + '-em').value = '';
  renderSettingsLists();
}
async function removeAction(id) {
  var r = await supa.from('color_chart_actions').update({ active: false }).eq('id', id);
  if (r.error) { showBanner('Could not save 😕'); return; }
  actions = actions.map(function(a) { if (a.id === id) a.active = false; return a; });
  renderSettingsLists();
}
function weightSelect(v, attrs) {
  return '<select class="wsel" ' + attrs + '>' + [1,2,3,4,5].map(function(n) { return '<option value="' + n + '"' + (n === +v ? ' selected' : '') + '>' + n + (n === 1 ? ' spot' : ' spots') + '</option>'; }).join('') + '</select>';
}
async function setWeight(id, v) {
  var r = await supa.from('color_chart_actions').update({ weight: +v }).eq('id', id);
  if (r.error) { showBanner('Could not save 😕'); return; }
  actions.forEach(function(a) { if (a.id === id) a.weight = +v; });
  showBanner('Saved ✓');
}
function copyShare() {
  var u = shareUrl();
  navigator.clipboard.writeText(u).then(function() { showBanner('📋 Copied! Text it to the teacher'); }).catch(function() { prompt('Copy this link:', u); });
}
async function newShare() {
  if (!confirm('Make a new link? The old one will stop working for the teacher.')) return;
  var t = (crypto.randomUUID ? crypto.randomUUID() : null);
  if (!t) { showBanner('Not supported here'); return; }
  var r = await supa.from('color_chart_kids').update({ share_token: t }).eq('id', kid.id);
  if (r.error) { showBanner('Could not save 😕'); return; }
  kid.share_token = t; renderSettingsLists(); showBanner('New link ready');
}

// ═══ TEACHER MODE ═══
var teacherActions = [], teacherLevel = 5;
async function teacherRefresh(extra) {
  try {
    var body = Object.assign({ token: SHARE_TOKEN, day: todayStr() }, extra || {});
    var r = await fetch(FN_SHARE, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    var d = {}; try { d = await r.json(); } catch (_) {}
    if (!r.ok || d.error) { setSync(d.error || 'Could not load', '#E84A4A'); return false; }
    teacherActions = d.actions || []; teacherLevel = d.level;
    renderKid(d.name, d.level);
    renderNaps(d.naps || [], false);
    if (d.share_reasons) renderLog(d.events || [], false);
    else document.getElementById('log').innerHTML = '<div class="empty">⬆️ ' + d.ups + ' up · ⬇️ ' + d.downs + ' down today</div>';
    setSync('Updated ' + fmtTime(new Date().toISOString()), '#9B59B6');
    return true;
  } catch (e) { setSync('Could not load', '#E84A4A'); return false; }
}
async function teacherAdd(kind) {
  var opts = teacherActions.filter(function(a) { return a.kind === kind; });
  var c = await askChoice(kind === 'up' ? 'What did she do?' : 'What happened?', opts, true, 'Details (optional)'); if (!c) return;
  var before = teacherLevel;
  var ok = await teacherRefresh({ action: 'add', kind: kind, label: c.label, note: c.note, weight: c.weight });
  if (!ok) { showBanner('Could not save 😕'); return; }
  if (kind === 'up') { confetti(); showBanner(teacherLevel > before ? '⬆️ Moved up to ' + levelInfo(teacherLevel).word + '!' : '⭐ Already at the top!'); }
  else showBanner(teacherLevel < before ? '⬇️ Moved down to ' + levelInfo(teacherLevel).word : 'Already at red');
}

// ═══ START ═══
(async function() {
  var ticks = ''; for (var i = 0; i < MAX; i++) ticks += '<div class="tick" style="top:' + (i / (MAX - 1) * 100) + '%"></div>';
  document.getElementById('ticks').innerHTML = ticks;
  if (SHARE_TOKEN) {
    document.body.classList.add('teacher');
    document.querySelectorAll('.family-only').forEach(function(el) { el.classList.add('hidden'); });
    document.getElementById('gear-btn').classList.add('hidden');
    document.getElementById('back-link').classList.add('hidden');
    document.getElementById('teacher-note').classList.remove('hidden');
    await teacherRefresh();
    pollTimer = setInterval(teacherRefresh, 30000);
  } else {
    await Auth.ready;
    await loadAll();
    pollTimer = setInterval(function() { if (kid && !document.hidden) refresh(); }, 10000);
  }
  document.addEventListener('visibilitychange', function() { if (document.hidden) return; if (SHARE_TOKEN) teacherRefresh(); else if (kid) refresh(); });
})();
</script>
