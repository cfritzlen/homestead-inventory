<!doctype html>
<html lang="en">
<head>
<!-- AUTH_GATE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/auth.js"></script>
<script>Auth.requireAuth();</script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connecting Google…</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
         background: #f4f4f0; margin: 0; min-height: 100vh;
         display: flex; align-items: center; justify-content: center; padding: 20px; }
  .card { background: #fff; padding: 28px 32px; border-radius: 10px; border: 1px solid #e3e3dd;
          width: 100%; max-width: 480px; }
  h1 { margin: 0 0 6px; font-size: 22px; }
  p { color: #444; font-size: 14px; margin: 6px 0; }
  .ok  { color: #1d6b1d; }
  .err { color: #8a1d1d; background: #fbeaea; padding: 10px; border-radius: 6px; margin-top: 12px; }
  a.btn { display: inline-block; margin-top: 14px; padding: 8px 14px; background: #06408d;
          color: #fff; text-decoration: none; border-radius: 6px; font-size: 14px; }
</style>
</head>
<body>
<div class="card">
  <h1>Connecting Google…</h1>
  <div id="out"><p>Exchanging your authorization…</p></div>
</div>
<script>
(async function () {
  const out = document.getElementById('out');
  const params = new URLSearchParams(location.search);
  const code = params.get('code');
  const err = params.get('error');
  if (err) { out.innerHTML = `<div class="err">Google returned an error: ${err}</div>`; return; }
  if (!code) { out.innerHTML = `<div class="err">No authorization code in URL — try again from Family Hub.</div>`; return; }

  // Call the Edge Function to swap the code for tokens
  const supaUrl = Auth.client.supabaseUrl; // exposed by supabase-js
  const anonKey = Auth.client.supabaseKey;
  const redirectUri = `${location.origin}${location.pathname}`;

  try {
    const res = await fetch(`${supaUrl}/functions/v1/google-oauth-exchange`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': anonKey },
      body: JSON.stringify({ code, redirect_uri: redirectUri }),
    });
    const data = await res.json();
    if (!res.ok) {
      out.innerHTML = `<div class="err">${data.error || 'exchange failed'}</div>
                      <a class="btn" href="family-hub.html">← Back</a>`;
      return;
    }
    out.innerHTML = `
      <p class="ok">✓ Connected as <b>${data.account_email}</b></p>
      <p>Scopes: <code style="font-size:12px;">${data.scopes}</code></p>
      <p>You're set. Approved events will now push to this account's calendar,
         and emails you label <b>family-hub</b> will get ingested within 15 minutes.</p>
      <a class="btn" href="family-hub.html">Go to Family Hub →</a>`;
  } catch (e) {
    out.innerHTML = `<div class="err">${e.message}</div>
                    <a class="btn" href="family-hub.html">← Back</a>`;
  }
})();
</script>
</body>
</html>
