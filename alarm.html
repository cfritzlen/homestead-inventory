<!DOCTYPE html>
<html lang="en">
<head>
<!-- AUTH_GATE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/auth.js"></script>
<script>Auth.requireAuth();</script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alarm Control — Homestead Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@300;400;600&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        :root{
            --sage-50:#f6f7f3;--sage-100:#e8ebe0;--sage-200:#d4dac5;--sage-300:#b8c5a3;--sage-400:#98ab7e;
            --sage-500:#7a9061;--sage-600:#5f734c;--sage-700:#4a5a3b;--sage-800:#3d4a32;
            --cream:#ece8dd;--taupe:#c4b5a4;--dusty-sage:#a4ac95;--mauve:#a88479;--charcoal:#4a4d47;--dusty-rose:#9b7269;
        }
        body{font-family:'Karla',sans-serif;background:var(--charcoal);min-height:100vh;color:var(--cream);}
        .top-bar{display:flex;align-items:center;padding:16px 24px;background:rgba(0,0,0,0.2);}
        .top-bar a{color:var(--taupe);text-decoration:none;font-size:0.95rem;transition:color 0.2s;}
        .top-bar a:hover{color:var(--cream);}
        .main-content{padding:24px 20px 60px;max-width:600px;margin:0 auto;}
        header{text-align:center;margin-bottom:24px;}
        header .icon{font-size:2.5rem;margin-bottom:8px;}
        h1{font-family:'Crimson Pro',serif;font-size:2.6rem;font-weight:300;letter-spacing:1px;margin-bottom:4px;}
        .subtitle{font-size:1rem;color:var(--taupe);}

        .status-bar{display:flex;justify-content:center;gap:8px;margin-bottom:28px;flex-wrap:wrap;}
        .status-pill{display:inline-flex;align-items:center;gap:6px;background:rgba(236,232,221,0.1);border:1px solid rgba(236,232,221,0.15);border-radius:20px;padding:6px 14px;font-size:0.82rem;color:var(--taupe);}
        .status-dot{width:8px;height:8px;border-radius:50%;background:var(--dusty-rose);animation:none;}
        .status-dot.connected{background:#66BB6A;animation:pulse 2s infinite;}
        @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.4;}}

        .controls{display:flex;flex-direction:column;gap:16px;}

        .control-card{background:rgba(236,232,221,0.06);border:1px solid rgba(236,232,221,0.1);border-radius:16px;padding:24px;display:flex;align-items:center;justify-content:space-between;}
        .control-label{display:flex;align-items:center;gap:12px;}
        .control-label .icon{font-size:1.8rem;}
        .control-label .name{font-family:'Crimson Pro',serif;font-size:1.4rem;font-weight:400;color:var(--cream);}
        .control-label .desc{font-size:0.82rem;color:var(--taupe);margin-top:2px;}

        .toggle-btn{width:60px;height:32px;border-radius:16px;border:none;cursor:pointer;position:relative;transition:background 0.3s;background:rgba(236,232,221,0.15);}
        .toggle-btn::after{content:'';position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:var(--cream);transition:transform 0.3s;}
        .toggle-btn.on{background:var(--sage-500);}
        .toggle-btn.on::after{transform:translateX(28px);}

        .panic-section{margin-top:32px;}
        .panic-btn{width:100%;padding:28px;border-radius:16px;border:2px solid var(--dusty-rose);background:rgba(155,114,105,0.15);color:var(--dusty-rose);font-family:'Crimson Pro',serif;font-size:1.8rem;font-weight:600;cursor:pointer;transition:all 0.2s;letter-spacing:1px;}
        .panic-btn:hover{background:rgba(155,114,105,0.3);border-color:var(--cream);color:var(--cream);}
        .panic-btn:active,.panic-btn.active{background:var(--dusty-rose);color:white;border-color:var(--dusty-rose);transform:scale(0.98);}

        .timer-section{margin-top:20px;text-align:center;}
        .timer-label{font-size:0.82rem;color:var(--taupe);margin-bottom:8px;}
        .timer-options{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;}
        .timer-opt{background:rgba(236,232,221,0.1);border:1px solid rgba(236,232,221,0.15);border-radius:12px;padding:8px 16px;font-size:0.9rem;color:var(--taupe);cursor:pointer;transition:all 0.2s;font-family:'Karla',sans-serif;}
        .timer-opt:hover,.timer-opt.selected{background:rgba(236,232,221,0.2);color:var(--cream);border-color:rgba(236,232,221,0.3);}

        .log{margin-top:28px;background:rgba(0,0,0,0.2);border-radius:12px;padding:16px;max-height:160px;overflow-y:auto;font-size:0.8rem;color:var(--dusty-sage);font-family:monospace;}
        .log .entry{padding:2px 0;border-bottom:1px solid rgba(236,232,221,0.05);}

        @media(max-width:768px){
            h1{font-size:2rem;}
            .main-content{padding:16px 12px 40px;}
            .control-card{padding:18px 16px;}
            .panic-btn{padding:22px;font-size:1.5rem;}
        }
    </style>
</head>
<body>
    <div class="top-bar"><a href="index.html">&larr; Back to Hub</a></div>

    <div class="main-content">
        <header>
            <div class="icon">🚨</div>
            <h1>Alarm Control</h1>
            <p class="subtitle">Kasa EP40 — Coop Defense</p>
        </header>

        <div class="status-bar">
            <div class="status-pill"><span class="status-dot" id="statusDot"></span><span id="statusText">Connecting...</span></div>
        </div>

        <div class="controls">
            <div class="control-card">
                <div class="control-label">
                    <div class="icon">💡</div>
                    <div>
                        <div class="name">Floodlight</div>
                        <div class="desc">Plug 2 — deer deterrent</div>
                    </div>
                </div>
                <button class="toggle-btn" id="lightToggle" onclick="toggleLight()"></button>
            </div>

            <div class="control-card">
                <div class="control-label">
                    <div class="icon">🔊</div>
                    <div>
                        <div class="name">Siren</div>
                        <div class="desc">Plug 1 — predator alarm</div>
                    </div>
                </div>
                <button class="toggle-btn" id="sirenToggle" onclick="toggleSiren()"></button>
            </div>
        </div>

        <div class="panic-section">
            <button class="panic-btn" id="panicBtn" onclick="panic()">FULL ALARM</button>
        </div>

        <div class="timer-section">
            <div class="timer-label">Auto-off timer</div>
            <div class="timer-options">
                <button class="timer-opt" onclick="setTimer(10)">10s</button>
                <button class="timer-opt selected" onclick="setTimer(30)">30s</button>
                <button class="timer-opt" onclick="setTimer(60)">1m</button>
                <button class="timer-opt" onclick="setTimer(300)">5m</button>
                <button class="timer-opt" onclick="setTimer(0)">Stay on</button>
            </div>
        </div>

        <div class="log" id="log"></div>
    </div>

    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <script>
        const MQTT_HOST = 'ws://192.168.1.200:9001';
        const TOPIC = 'homestead/alarm/trigger';

        let client;
        let lightOn = false;
        let sirenOn = false;
        let timerDuration = 30;
        let lightTimer = null;
        let sirenTimer = null;

        function log(msg) {
            const el = document.getElementById('log');
            const time = new Date().toLocaleTimeString();
            el.innerHTML = `<div class="entry">${time} — ${msg}</div>` + el.innerHTML;
        }

        function connect() {
            client = mqtt.connect(MQTT_HOST);
            client.on('connect', () => {
                document.getElementById('statusDot').className = 'status-dot connected';
                document.getElementById('statusText').textContent = 'Connected';
                log('Connected to MQTT broker');
            });
            client.on('error', (err) => {
                document.getElementById('statusDot').className = 'status-dot';
                document.getElementById('statusText').textContent = 'Disconnected';
                log('Connection error');
            });
            client.on('close', () => {
                document.getElementById('statusDot').className = 'status-dot';
                document.getElementById('statusText').textContent = 'Disconnected';
            });
        }

        function send(action) {
            if (client && client.connected) {
                client.publish(TOPIC, action);
                log(`Sent: ${action}`);
            } else {
                log('Not connected — retrying...');
                connect();
            }
        }

        function toggleLight() {
            if (lightOn) {
                send('light_off');
                lightOn = false;
                document.getElementById('lightToggle').classList.remove('on');
                clearTimeout(lightTimer);
                log('Light OFF');
            } else {
                send('light_on');
                lightOn = true;
                document.getElementById('lightToggle').classList.add('on');
                log('Light ON');
                if (timerDuration > 0) {
                    lightTimer = setTimeout(() => {
                        send('light_off');
                        lightOn = false;
                        document.getElementById('lightToggle').classList.remove('on');
                        log('Light auto-off');
                    }, timerDuration * 1000);
                }
            }
        }

        function toggleSiren() {
            if (sirenOn) {
                send('siren_off');
                sirenOn = false;
                document.getElementById('sirenToggle').classList.remove('on');
                clearTimeout(sirenTimer);
                log('Siren OFF');
            } else {
                send('siren_on');
                sirenOn = true;
                document.getElementById('sirenToggle').classList.add('on');
                log('Siren ON');
                if (timerDuration > 0) {
                    sirenTimer = setTimeout(() => {
                        send('siren_off');
                        sirenOn = false;
                        document.getElementById('sirenToggle').classList.remove('on');
                        log('Siren auto-off');
                    }, timerDuration * 1000);
                }
            }
        }

        function panic() {
            const btn = document.getElementById('panicBtn');
            if (lightOn && sirenOn) {
                send('all_off');
                lightOn = false;
                sirenOn = false;
                document.getElementById('lightToggle').classList.remove('on');
                document.getElementById('sirenToggle').classList.remove('on');
                btn.classList.remove('active');
                clearTimeout(lightTimer);
                clearTimeout(sirenTimer);
                log('FULL ALARM OFF');
            } else {
                send('all_on');
                lightOn = true;
                sirenOn = true;
                document.getElementById('lightToggle').classList.add('on');
                document.getElementById('sirenToggle').classList.add('on');
                btn.classList.add('active');
                log('FULL ALARM ON');
                if (timerDuration > 0) {
                    lightTimer = setTimeout(() => {
                        send('all_off');
                        lightOn = false;
                        sirenOn = false;
                        document.getElementById('lightToggle').classList.remove('on');
                        document.getElementById('sirenToggle').classList.remove('on');
                        btn.classList.remove('active');
                        log('Full alarm auto-off');
                    }, timerDuration * 1000);
                }
            }
        }

        function setTimer(seconds) {
            timerDuration = seconds;
            document.querySelectorAll('.timer-opt').forEach(el => el.classList.remove('selected'));
            event.target.classList.add('selected');
            log(seconds > 0 ? `Timer set to ${seconds}s` : 'Timer off — stay on until manual off');
        }

        connect();
    </script>
</body>
</html>
