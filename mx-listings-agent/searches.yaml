# Edit this file to add/remove/tune searches. Each entry becomes one section of the weekly email.
#
# Fields:
#   name             — display label
#   city_query       — free-text keyword filter (lowercase, no accents); matched against listing title/description
#   state            — Mexican state name (used as a soft filter on results)
#   operation        — Venta (sale) or Renta (rent). Default Venta.
#   min_bedrooms     — integer, optional
#   max_price_usd    — cap (we convert MXN prices to USD at the rate in src/main.py)
#   min_price_usd    — floor, optional
#   nightly_rate_usd — your estimate of nightly Airbnb rate for a typical unit in this area
#   occupancy        — your estimate of annual occupancy (0.0–1.0)
#   notes            — free-text reminder for yourself (not used by the code)
#
# Cities below are all reachable from JFK/EWR/LGA with at least one direct/nonstop flight.

- name: Ajijic (Lake Chapala expat hub)
  city_query: ajijic
  state: Jalisco
  operation: Venta
  min_bedrooms: 2
  max_price_usd: 400000
  nightly_rate_usd: 85
  occupancy: 0.55
  notes: Year-round expat retiree market, low seasonality

